<!doctype html>
<meta charset="utf-8">
<title>Compact assertion regression checks</title>
<link rel="stylesheet" href="../../style/token.css">
<style>body { font: 24px serif; } #fixtures > div { margin: 12px; }</style>
<pre id="result">Running…</pre>
<div id="fixtures"></div>
<script type="module">
import { runAssertionChecks } from './assertions.mjs';
try {
    const count = runAssertionChecks(document.getElementById('fixtures'));
    document.getElementById('result').textContent = `${count} checks passed`;
    window.testResult = { passed: count };
} catch (error) {
    document.getElementById('result').textContent = error.stack;
    window.testResult = { error: error.stack };
}
</script>
