<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deductrium · 地图编辑器</title>
  <script src="../../js/theme.js"></script>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="world-picker.css">
</head>
<body>
  <header class="topbar">
    <button id="project-heading" class="project-heading" data-open-panel="project" aria-controls="project-panel" aria-expanded="false"><span class="eyebrow">DEDUCTRIUM · MAP STUDIO</span><span class="project-heading-line"><strong id="project-heading-title">地图编辑器</strong><span id="dirty-indicator" aria-label="保存状态"></span></span></button>
    <div class="actions history"><button id="undo" disabled aria-label="撤销">撤销</button><button id="redo" disabled aria-label="重做">重做</button></div>
    <div class="actions top-actions">
      <button id="export-project" class="primary">保存<span class="desktop-label">项目 JSON</span></button><button id="play-map">▶<span class="desktop-label"> 试玩地图</span><span class="sr-only">试玩</span></button>
      <details id="file-menu" class="popover"><summary>文件 ⋯</summary><div class="popover-body file-actions"><button id="new-project">新建空图</button><button id="official-map">加载官方图</button><button id="import">导入文件</button><button id="export-source">导出 map.ts</button><button id="recover-draft" hidden>导出未恢复草稿</button></div></details>
      <input id="file" type="file" accept=".ts,.json,.txt" hidden>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <nav class="task-nav" aria-label="编辑任务">
      <button id="open-tiles" data-open-panel="tiles" aria-controls="tiles-panel" aria-expanded="false"><span class="nav-glyph" aria-hidden="true">⬡</span><span class="nav-label">格子</span></button>
      <button id="open-modules" data-open-panel="modules" aria-controls="modules-panel" aria-expanded="false"><span class="nav-glyph" aria-hidden="true">▦</span><span class="nav-label">模块</span></button>
      <button id="open-project" data-open-panel="project" aria-controls="project-panel" aria-expanded="false"><span class="nav-glyph" aria-hidden="true">◈</span><span class="nav-label">项目</span></button>
    </nav>
    <aside id="task-panel" class="task-panel panel" aria-label="任务面板" hidden>
      <div class="pane-heading task-heading"><h2 id="task-title">任务</h2><button id="close-panel" class="icon-button" aria-label="关闭任务面板" title="关闭（Esc）">×</button></div>
      <div class="task-content">
        <section id="tiles-panel" class="task-section tiles-section" aria-label="格子" hidden>
          <div class="list-tools">
            <label for="search" class="sr-only">查找格子</label><input id="search" type="search" placeholder="搜索名称、文字、坐标、实例">
            <div class="list-filter"><label class="inline-field">类型<select id="filter"><option value="all">全部</option><option value="0">道路</option><option value="1">墙</option><option value="2">门</option><option value="3">奖励</option><option value="4">序数</option><option value="mounted">模块实例格</option><option value="group">仅选区</option></select></label><button id="select-filtered" type="button" title="把当前筛选结果设为选区">全选结果</button></div>
            <p id="count" class="hint"></p>
          </div>
          <div id="tiles" class="tile-list" aria-label="地图格子列表"></div><button id="more-tiles" class="more-button" hidden>显示更多</button>
        </section>
        <section id="modules-panel" class="task-section" aria-label="模块" hidden>
          <section id="module-panel" class="panel-group" aria-labelledby="module-place-title">
            <div class="group-head"><h3 id="module-place-title">放置模块</h3><button id="import-module" type="button" class="small" title="从 JSON 文件导入模块到库">导入…</button></div>
            <label>模块库<select id="module-library" aria-label="模块库"></select></label>
            <form id="mount-form" class="mount-form">
              <div class="field-pair"><label>实例 ID<input id="instance-id" value="instance-1" required></label><label>旋转<select id="mount-rotation"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
              <label>锚点坐标<input id="mount-at" value="[]" placeholder="[] 或 0,1,3"></label>
              <div class="anchor-row"><label class="inline-field">当前格的边<select id="mount-edge"><option value="here">原位</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button id="anchor-selected" type="button">取当前格锚点</button></div>
              <div class="actions mount-actions"><button id="preview-mount" type="button">预览</button><button id="confirm-mount" class="primary" type="submit" disabled>确认挂载</button><button id="clear-preview" type="button">清除预览</button></div>
            </form>
            <output id="mount-preview" class="preview-output">先选择模块并预览。</output>
          </section>
          <details class="panel-group" open><summary>已挂载实例</summary><div id="instances" class="instance-list"></div></details>
          <details id="module-export" class="panel-group"><summary>导出选区为模块</summary>
            <div class="field-pair"><label>模块 ID<input id="module-export-id" value="my-module"></label><label>标题<input id="module-export-title" value="我的模块"></label></div>
            <p class="hint">以当前格为原点；选区为空时导出当前单格。</p><button id="export-module">导出模块 JSON</button>
          </details>
        </section>
        <section id="project-panel" class="task-section project-section" aria-label="项目" hidden>
          <form id="project-form" class="panel-group" aria-labelledby="project-info-title"><h3 id="project-info-title">项目信息</h3><div class="field-pair"><label>项目 ID<input id="project-id" required></label><label>标题<input id="project-title"></label></div><button id="apply-project" type="submit">应用项目信息</button></form>
          <details id="publish-settings" class="panel-group" open><summary>世界设置</summary><div id="world-settings" class="world-settings"></div></details>
          <div class="publish-bar" role="group" aria-label="发布世界"><button id="export-world" class="primary" type="button">发布 mod JSON</button><button id="play-world" type="button">▶ 试玩世界</button></div>
        </section>
      </div>
    </aside>
    <section class="map-pane panel" aria-label="地图视图">
      <nav class="canvas-tools" aria-label="编辑工具">
        <label>工具 <select id="mode"><option value="select">选格</option><option value="0">画道路</option><option value="1">画墙</option><option value="2">画门</option><option value="3">画奖励</option><option value="4">画序数</option><option value="erase">擦除</option></select></label>
        <label class="check"><input id="multi-select" type="checkbox">多选</label>
        <details id="view-menu" class="popover"><summary>视图</summary><div class="popover-body"><label>预览语言 <select id="map-language"><option value="zh">中文</option><option value="en">English</option></select></label><label>主题 <select id="theme-select"><option value="auto">跟随系统</option><option value="light">白天</option><option value="dark">黑夜</option></select></label><label class="check"><input id="grid" type="checkbox">空格网格</label><label class="check"><input id="highlight" type="checkbox">推理素高亮</label></div></details>
      </nav>
      <div class="selection-bar" id="selection-bar" hidden><span id="selection-count">选区 0 格</span><button id="open-module-export">导出为模块…</button><button id="clear-group">清空选区</button></div>
      <div class="canvas-wrap"><canvas id="map" aria-label="地图：单击选格或绘制，拖动平移，Shift 或多选开关加入选区"></canvas><div id="markers" aria-hidden="true"></div><div id="map-note" class="map-note"><span>拖动平移 · 单击使用工具 · Shift / 多选开关多选<br>空白格也可选；邻接边编号 0–5</span><button id="dismiss-note" aria-label="关闭地图提示">×</button></div></div>
      <form id="locate-form" class="locate-row"><label class="sr-only" for="location">名称或坐标</label><input id="location" placeholder="名称 / 0,1,3 / [] 原点"><button type="submit">前往</button><button id="home" type="button">原点</button><button id="locate" type="button">当前格</button></form>
      <div class="map-footer"><output id="coordinate">原点 []</output></div>
    </section>
    <div id="inspector-resizer" role="separator" tabindex="0" aria-label="调整属性面板宽度" aria-orientation="vertical" aria-controls="inspector" title="拖动调整宽度；双击恢复默认宽度"></div>
    <aside id="inspector" class="inspector panel" aria-label="格子属性">
      <div class="pane-heading inspector-heading"><h2 id="tile-title">格子属性</h2><span id="pending" class="badge" hidden>尚未应用</span><button id="toggle-inspector" aria-controls="inspector-content" aria-expanded="false">展开属性</button></div>
      <div id="inspector-content" class="inspector-content">
      <div class="identity"><div id="tile-meta" class="meta"></div><div id="neighbors" class="neighbors" role="group" aria-label="跳到相邻格"><button type="button" data-edge="0">0</button><button type="button" data-edge="1">1</button><button type="button" data-edge="2">2</button><button type="button" data-edge="3">3</button><button type="button" data-edge="4">4</button><button type="button" data-edge="5">5</button></div></div>
      <p id="mounted-note" class="notice" hidden></p>
      <form id="tile-form">
        <fieldset id="tile-fields"><div class="field-pair"><label>类型<select id="tile-type"><option value="0">道路 / 提示</option><option value="1">墙</option><option value="2">门</option><option value="3">奖励</option><option value="4">序数</option></select></label><label>名称<input id="tile-name" autocomplete="off"></label></div>
          <div class="field-head"><span>文字</span><select id="text-mode" aria-label="文字格式"><option value="plain">通用文字</option><option value="languages">多语言文字</option></select></div>
          <label id="plain-field"><span class="sr-only">文字</span><textarea id="text-plain" rows="3" spellcheck="false"></textarea></label>
          <div id="language-fields" hidden><label>中文 zh<textarea id="text-zh" rows="3" spellcheck="false"></textarea></label><label>English en<textarea id="text-en" rows="3" spellcheck="false"></textarea></label><details><summary>其他语言 JSON</summary><textarea id="text-other" rows="3" aria-label="其他语言 JSON" spellcheck="false">{}</textarea></details></div>
          <details id="script-section"><summary>脚本 <span id="script-summary" class="hint"></span></summary>
          <div class="script-toolbar" role="toolbar" aria-label="脚本工具"><select id="script-insert" aria-label="插入命令或模板"><option value="">插入…</option></select><button id="script-check" type="button">检查</button><button id="script-help-toggle" type="button" aria-controls="script-help" aria-expanded="false">参考</button></div>
          <div class="code-field"><pre id="script-gutter" aria-hidden="true">1</pre><textarea id="tile-script" wrap="off" rows="6" spellcheck="false" aria-label="地图脚本" aria-describedby="script-error" placeholder="// 每行一条命令，如 give key red"></textarea></div>
          <p id="script-error" class="field-error" aria-live="polite" hidden><span id="script-error-text"></span> <button id="script-goto" type="button">跳到该行</button></p>
          <section id="script-help" class="script-help" aria-label="脚本命令参考" hidden></section>
          </details>
          <details id="data-section"><summary>高级 data JSON <span id="data-summary" class="hint"></span></summary><label><span class="sr-only">其他 data JSON</span><textarea id="tile-data" rows="7" spellcheck="false" aria-describedby="data-error">{}</textarea></label>
          <p id="data-error" class="field-error" aria-live="polite" hidden></p>
          <p class="hint">p/d/t/td/never、getD/payD、unl.layer、dstrTarget/requiresReward；script 在上方编辑。</p>
          </details>
          <div class="apply-bar actions"><button id="apply-tile" class="primary" type="submit">应用 Apply</button><button id="reset-form" type="button">还原表单</button><span id="apply-state" aria-live="polite"></span><details class="tile-actions"><summary aria-label="更多格子操作">更多</summary><button id="remove-tile" class="danger" type="button">删除本格</button></details></div>
        </fieldset>
      </form>
</div>
    </aside>
  </main>
  <div class="statusbar"><span id="status" role="status" aria-live="polite">正在加载…</span><span id="draft-status"></span></div>
  <div id="fatal" role="alert" hidden></div>
  <script type="module" src="editor.mjs"></script>
</body>
</html>
